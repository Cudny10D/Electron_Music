<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>托盘控制</title>
  <style>
    :root {
      --ink: #20211d;
      --ink-soft: #55574f;
      --muted: #8c8e85;
      --paper: rgba(248, 248, 244, 0.88);
      --line: rgba(20, 20, 16, 0.1);
      --hover: rgba(20, 20, 16, 0.055);
      --accent: #6f754d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2efe5;
        --ink-soft: rgba(242, 239, 229, 0.72);
        --muted: rgba(242, 239, 229, 0.45);
        --paper: rgba(24, 24, 20, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --hover: rgba(255, 255, 255, 0.07);
        --accent: #a7ad7a;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent;
      font-family: 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .menu {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding: 8px 7px;
      background: var(--paper);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .head {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px 10px;
      border-bottom: 1px solid var(--line);
    }
    .head__tag {
      font: 8px/1 'SFMono-Regular', Consolas, monospace;
      letter-spacing: 0.14em; color: var(--muted);
    }
    .head__song {
      flex: 1; min-width: 0;
      font-size: 11px; color: var(--ink-soft);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: right;
    }
    .list { flex: 1; display: flex; flex-direction: column; padding-top: 5px; }
    .row {
      display: grid; grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center; gap: 10px;
      width: 100%; height: 34px;
      padding: 0 10px;
      border: 0; border-radius: 4px;
      background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 12px;
      text-align: left; cursor: pointer;
      transition: background 0.14s, color 0.14s;
    }
    .row:hover { background: var(--hover); color: var(--ink); }
    .row svg { display: block; color: var(--muted); }
    .row:hover svg { color: var(--accent); }
    .row__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row__state {
      font: 9px/1 'SFMono-Regular', Consolas, monospace;
      letter-spacing: 0.1em; color: var(--muted);
    }
    .row.is-on .row__state { color: var(--accent); }
    .sep { height: 1px; margin: 5px 10px; background: var(--line); }
    .foot {
      padding: 7px 10px 2px;
      font: 8px/1 'SFMono-Regular', Consolas, monospace;
      letter-spacing: 0.14em; color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="menu">
    <div class="head">
      <span class="head__tag">TRAY / 控制</span>
      <span class="head__song" id="song">未播放</span>
    </div>

    <div class="list">
      <button class="row" data-action="play">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path id="playIcon" d="M7 4.5l9 5.5-9 5.5z" /></svg>
        <span class="row__label" id="playLabel">播放</span>
        <span class="row__state">SPACE</span>
      </button>
      <button class="row" data-action="prev">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 5 7 5zM6 5v10" /></svg>
        <span class="row__label">上一首</span>
      </button>
      <button class="row" data-action="next">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l7 5-7 5zM14 5v10" /></svg>
        <span class="row__label">下一首</span>
      </button>
      <button class="row" data-action="mode" id="modeRow">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12M13 4l3 3-3 3M16 13H4M7 10l-3 3 3 3" /></svg>
        <span class="row__label">播放模式</span>
        <span class="row__state" id="modeLabel">列表循环</span>
      </button>

      <div class="sep"></div>

      <button class="row" data-action="window">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="1.4" /><path d="M3 8h14" /></svg>
        <span class="row__label">显示 / 隐藏主界面</span>
      </button>
      <button class="row" data-action="lyric" id="lyricRow">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 6h14M3 10h11M3 14h14" /></svg>
        <span class="row__label">桌面歌词</span>
        <span class="row__state" id="lyricState">OFF</span>
      </button>

      <div class="sep"></div>

      <button class="row" data-action="quit">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M10 3v9M6.5 8.5L10 12l3.5-3.5M4 16h12" /></svg>
        <span class="row__label">退出 Electron Music</span>
      </button>
    </div>

    <div class="foot">ELECTRON MUSIC / TRAY</div>
  </div>

  <script>
    (function () {
      const api = window.trayMenuApi || {}
      const $ = (id) => document.getElementById(id)
      const MODES = ['顺序播放', '列表循环', '单曲循环', '随机播放']

      document.querySelectorAll('.row').forEach((row) => {
        row.addEventListener('click', () => {
          api.action && api.action(row.dataset.action)
        })
      })

      api.onState && api.onState(function (state) {
        if (!state) return
        $('song').textContent = state.song || '未播放'
        $('playLabel').textContent = state.playing ? '暂停' : '播放'
        $('playIcon').setAttribute('d', state.playing ? 'M6 4.5v11M14 4.5v11' : 'M7 4.5l9 5.5-9 5.5z')
        $('modeLabel').textContent = MODES[state.playMode] || MODES[0]
        const on = !!state.desktopLyric
        $('lyricState').textContent = on ? 'ON' : 'OFF'
        $('lyricRow').classList.toggle('is-on', on)
      })

      api.ready && api.ready()
    })()
  </script>
</body>
</html>
